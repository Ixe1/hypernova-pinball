<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HYPERNOVA — 3D Arcade Pinball</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050712'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%2300f0ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23ff2bd6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ffd740'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050712;
        color: #e6f2ff;
        font-family: 'Eurostile', 'Orbitron', 'Rajdhani', 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        touch-action: none;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #pinball-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="pinball-canvas" aria-label="HYPERNOVA 3D Pinball"></canvas>
      <div id="hud-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
